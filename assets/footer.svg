<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="155" viewBox="0 0 1000 155" role="img" aria-label="Build with curiosity. Document with clarity. One lab at a time.">
<style>
@keyframes travel { to { stroke-dashoffset:-480 } }
@keyframes arrow-drift { 0%,65%,100% { transform:translateX(0) } 35% { transform:translateX(8px) } }
@keyframes breathe { 0%,100% { opacity:.16 } 50% { opacity:.55 } }
@keyframes ring { 0%,100% { r:12px; opacity:.2 } 50% { r:17px; opacity:.45 } }
.packet { animation:travel 12s linear infinite }
.arrow { animation:arrow-drift 6s ease-in-out infinite }
.glow { animation:breathe 6s ease-in-out infinite }
.ring { animation:ring 6s ease-in-out infinite }
@media(prefers-reduced-motion:reduce) {
.packet,.arrow,.glow,.ring { animation:none }
}
</style>
<rect x="1" y="1" width="998" height="153" rx="18" fill="#0c1b2b" stroke="#284258"/>

<path d="M35 38H965" stroke="#284258" stroke-width="2"/>
<path class="packet" d="M35 38H965" stroke="#6ee7df" stroke-width="3" stroke-dasharray="14 466"/>
<text x="500" y="88" text-anchor="middle" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="25">Build with curiosity. Document with clarity.</text>
<text x="500" y="120" text-anchor="middle" fill="#6ee7df" font-family="monospace" font-size="13" letter-spacing="3">AYHMQQ / ONE LAB AT A TIME</text>
<g aria-hidden="true" class="glow" opacity=".3" fill="none" stroke="#6ee7df" stroke-width="1.5"><path d="M55 77l10 10-10 10m890-20-10 10 10 10"/><circle cx="35" cy="38" r="4" fill="#6ee7df"/><circle cx="965" cy="38" r="4" fill="#6ee7df"/></g>
</svg>