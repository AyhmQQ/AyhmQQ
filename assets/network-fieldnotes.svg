<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Ayham Alderbashi — Networking and Network Security</title>
<desc id="desc">A navy and cyan network field notebook. Cybersecurity student, preparing for CCNA. Learn, build, verify, document. Subtle animated packets follow the network links; animation respects reduced-motion preferences.</desc>
<style>
@keyframes packet-main {
  0%,100% { transform:translate(850px,161px); opacity:.35 }
  8% { opacity:1 }
  30% { transform:translate(905px,161px) }
  70% { transform:translate(1025px,161px); opacity:1 }
  82% { transform:translate(1025px,161px); opacity:0 }
  83% { transform:translate(850px,161px); opacity:0 }
}
@keyframes packet-loop {
  0% { transform:translate(905px,105px); opacity:.3 }
  8% { opacity:1 }
  40% { transform:translate(1067px,105px) }
  75% { transform:translate(1067px,255px) }
  95%,100% { transform:translate(943px,255px); opacity:0 }
}
@keyframes router-pulse {
  0%,100% { transform:scale(1); opacity:.08 }
  50% { transform:scale(1.16); opacity:.3 }
}
@keyframes status-pulse { 0%,100% { opacity:1 } 50% { opacity:.4 } }
.packet-main { transform:translate(850px,161px); animation:packet-main 6s linear infinite }
.packet-loop { transform:translate(905px,105px); animation:packet-loop 9s linear infinite }
.router-pulse { transform-origin:905px 161px; animation:router-pulse 5s ease-in-out infinite }
.status-pulse { animation:status-pulse 4s ease-in-out infinite }
@media (prefers-reduced-motion:reduce) {
  .packet-main,.packet-loop,.router-pulse,.status-pulse { animation:none }
  .router-pulse { opacity:.18 }
}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#20334a" stroke-width=".6"/></pattern>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091321"/><stop offset="1" stop-color="#10263b"/></linearGradient>
</defs>
<rect width="1200" height="440" rx="20" fill="url(#bg)"/>
<rect width="1200" height="440" rx="20" fill="url(#grid)" opacity=".65"/>
