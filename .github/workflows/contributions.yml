name: Contribution animation

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contributions.yml"

permissions:
  contents: write

concurrency:
  group: contribution-animation
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Animate the contribution calendar
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: AyhmQQ
          outputs: |
            assets/contributions-dark.svg?palette=github-dark&color_snake=#6ee7df&color_dots=#142536,#164454,#1f7180,#32aaa9,#6ee7df
            assets/contributions-light.svg?palette=github-light&color_snake=#096b78&color_dots=#e7eff5,#b5e4e6,#73c8cf,#32a6b2,#096b78
      - name: Save updated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-dark.svg assets/contributions-light.svg
          if git diff --cached --quiet; then
            echo "Contribution artwork is already current."
            exit 0
          fi
          git commit -m "Refresh contribution animation"
          git pull --rebase origin main
          git push origin HEAD:main
